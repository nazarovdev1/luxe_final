  <script>
    // Suppress ResizeObserver loop errors & auto-recover from deployment chunk loading errors
    (function() {
      const isResizeObserverError = (err) => {
        if (!err) return false;
        const msg = typeof err === 'string' ? err : (err.message || (err.reason && err.reason.message) || '');
        return (
          msg.includes('ResizeObserver') &&
          (msg.includes('loop') || msg.includes('limit') || msg.includes('undelivered notifications'))
        );
      };

      const isChunkLoadError = (err) => {
        if (!err) return false;
        const msg = typeof err === 'string' ? err : (err.message || (err.reason && err.reason.message) || '');
        return (
          msg.includes('Unable to preload CSS') ||
          msg.includes('Failed to fetch dynamically imported module') ||
          msg.includes('error loading dynamically imported module') ||
          msg.includes('Importing a module script failed')
        );
      };

      const handleChunkError = () => {
        const lastReload = sessionStorage.getItem('luxe_chunk_reload');
        const now = Date.now();
        if (!lastReload || now - parseInt(lastReload, 10) > 10000) {
          sessionStorage.setItem('luxe_chunk_reload', now.toString());
          window.location.reload();
        }
      };

      window.addEventListener('vite:preload-error', function(event) {
        event.preventDefault();
        handleChunkError();
      });

      const originalError = console.error;
      console.error = function(...args) {
        if (args[0] && (isResizeObserverError(args[0]) || isChunkLoadError(args[0]))) return;
        originalError.apply(console, args);
      };

      const originalWarn = console.warn;
      console.warn = function(...args) {
        if (args[0] && (isResizeObserverError(args[0]) || isChunkLoadError(args[0]))) return;
        originalWarn.apply(console, args);
      };

      window.addEventListener('error', function(e) {
        if (isChunkLoadError(e.error) || isChunkLoadError(e.message) || (e.target && e.target.tagName === 'LINK' && e.target.rel === 'preload')) {
          handleChunkError();
        }
        if (isResizeObserverError(e.message) || isResizeObserverError(e.error)) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        if (isChunkLoadError(e.reason)) {
          handleChunkError();
        }
        if (isResizeObserverError(e.reason)) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    })();
  </script>

    document.documentElement.classList.add('js');

  <style>
    /* Until the app draws, the pre-rendered text for search engines stays out of sight
       behind a quiet skeleton. Without JavaScript the text is shown as it is. */
    html { background: #08090b; }
    .js #root > [data-seo-shell] { display: none; }
    html:not(.js) #boot, #boot:has(+ #root > :not([data-seo-shell])) { display: none; }
    .boot { position: fixed; inset: 0; z-index: 9998; overflow: hidden; padding: 22px clamp(20px, 8vw, 140px); background: #08090b; }
    .boot__s { display: block; position: relative; overflow: hidden; border-radius: 3px; background: #131316; }
    .boot__s::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(214, 180, 124, 0.1), transparent); animation: boot-shimmer 2.2s infinite; }
    .boot__bar { display: flex; align-items: center; justify-content: space-between; }
    .boot__logo { width: 70px; height: 28px; }
    .boot__nav { width: min(40vw, 300px); height: 12px; }
    .boot__body { display: grid; gap: 18px; max-width: 520px; margin-top: 14vh; }
    .boot__kicker { width: 130px; height: 10px; }
    .boot__title { height: clamp(44px, 8vw, 92px); }
    .boot__title--short { width: 62%; }
    .boot__line { width: 80%; height: 12px; }
    .boot__photo { height: 32vh; margin-top: 32px; }
    @media (min-width: 900px) { .boot__body { max-width: min(520px, 40vw); } .boot__photo { position: absolute; top: 18vh; right: clamp(20px, 8vw, 140px); width: 34vw; height: 66vh; margin: 0; } }
    @keyframes boot-shimmer { to { transform: translateX(100%); } }
    @media (prefers-reduced-motion: reduce) { .boot__s::after { animation: none; } }
  </style>
