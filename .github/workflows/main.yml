name: Luxe CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-check:
    name: Build and check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        working-directory: client
        env:
          CI: true
        run: npm run build

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Check backend JavaScript syntax and release invariants
        working-directory: server
        run: npm run verify

      - name: Audit production dependencies
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

      - name: Copy frontend build to server public folder
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p server/public
          cp -r client/build/* server/public/

      - name: Create Passenger restart file
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p server/tmp
          touch server/tmp/restart.txt

      - name: Deploy to Plesk via SFTP
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.PLESK_FTP_USERNAME }}
          server: ${{ secrets.PLESK_FTP_SERVER }}
          password: ${{ secrets.PLESK_FTP_PASSWORD }}
          port: 22
          local_path: './server/*'
          remote_path: '/server'
          sftp_only: false
          rsyncArgs: '--exclude=node_modules --exclude=.git --exclude=.env --exclude=.env.* --exclude=*.env --exclude=*.env.* --exclude=*.log --exclude=product_check_result.txt --exclude=luxe_database --exclude=*.bson --exclude=*.metadata.json --exclude=*.dump --exclude=*.archive --exclude=*.sql --exclude=*.sqlite --exclude=*.sqlite3 --exclude=*.db --exclude=*.bak --exclude=*.backup'
