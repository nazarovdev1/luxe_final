name: Luxe CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-check:
    name: Build and check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci --legacy-peer-deps

      - name: Audit frontend production dependencies
        working-directory: client
        run: npm audit --omit=dev --audit-level=high

      - name: Test, lint, and build frontend
        working-directory: client
        env:
          CI: true
        run: npm run verify

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Check backend JavaScript syntax and release invariants
        working-directory: server
        run: npm run verify

      - name: Audit production dependencies
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

# Deploys happen outside this workflow: Vercel builds the frontend from main on its own,
# and the backend goes to Cloud Run with `gcloud run deploy luxe-backend --source .`.
